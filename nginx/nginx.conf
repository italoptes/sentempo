server {
    listen 80;
    server_name _;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Proxy reverso para a API do backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Limitação da rota de login administrativo
        # (em produção, usar rate limiting via nginx mais avançado ou WAF)
    }

    # Arquivos estáticos do frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Fallback da SPA: qualquer rota desconhecida entrega o index.html
        try_files $uri $uri/ /index.html;

        # Cache de assets com hash (imutáveis)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
